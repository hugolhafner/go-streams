# go-streams Prometheus alerting rules — Four Golden Signals.
#
# GENERATED by generate_alerts.py — edit the script and re-run it
# (cd docs/prometheus && uv run generate_alerts.py); do not edit this file by hand.
#
# Assumptions (see README.md for how to adapt):
#   - Standard OTel -> Prometheus metric-name translation, matching the Grafana
#     dashboards in ../grafana: dots become underscores, counters gain _total,
#     duration histograms gain _seconds (stream_consumer_lag keeps no unit suffix).
#   - Applications are identified by the `job` label.
#   - stream_partitioned_* alerts only ever fire for the PartitionedRunner; the
#     SingleThreadedRunner emits no queue/backpressure metrics.
#   - Rate windows assume the OTel SDK's default 60s export period.

groups:

# Traffic — is data flowing?
- name: go-streams.traffic
  rules:

  # Active tasks but nothing consumed. Lag alerts go silent when consumption
  # stops (lag is only observed on consumed records), so this is the stall signal.
  # Relax or drop it for legitimately intermittent source topics.
  - alert: GoStreamsConsumptionStalled
    expr: |
      sum by (job) (rate(messaging_consumer_messages_total[10m])) == 0
      and
      sum by (job) (stream_tasks_active) > 0
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} stopped consuming"
      description: "{{ $labels.job }} owns partitions but has consumed no records for over 10 minutes. Check broker connectivity and the poll loop; if the source topic is legitimately intermittent, relax or drop this alert."

  # Application exporting metrics but owning no partitions.
  - alert: GoStreamsNoActiveTasks
    expr: |
      sum by (job) (stream_tasks_active) == 0
    for: 15m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} owns no partitions"
      description: "{{ $labels.job }} has been running with zero active tasks for 15 minutes. Check consumer-group membership, topic existence, and whether other group members hold every partition."

  # Poll() calls failing. No alert on poll *duration*: Poll blocks while idle,
  # so a slow poll means no traffic, not trouble.
  - alert: GoStreamsPollErrors
    expr: |
      sum by (job) (rate(stream_poll_duration_seconds_count{stream_poll_status="error"}[5m])) > 0
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} poll loop returning errors"
      description: "{{ $value | humanize }} failed polls/sec for 10 minutes. Check broker connectivity, authentication/ACLs and consumer-group health."

# Errors — is work failing?
- name: go-streams.errors
  rules:

  # More than 1% of consumed records producing errors. The `and`
  # clause suppresses the Inf ratio a zero-traffic application would produce.
  - alert: GoStreamsHighErrorRatio
    expr: |
      (
          sum by (job) (rate(stream_errors_total[5m]))
        /
          sum by (job) (rate(messaging_consumer_messages_total[5m]))
      ) > 0.01
      and
      sum by (job) (rate(messaging_consumer_messages_total[5m])) > 0
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} error ratio above 1%"
      description: "{{ $value | humanizePercentage }} of consumed records errored over the last 5m (threshold 1%). Break it down by stream_error_phase and stream_error_node on the Application Drill-Down dashboard."

  # Same signal at page-worthy volume.
  - alert: GoStreamsCriticalErrorRatio
    expr: |
      (
          sum by (job) (rate(stream_errors_total[5m]))
        /
          sum by (job) (rate(messaging_consumer_messages_total[5m]))
      ) > 0.05
      and
      sum by (job) (rate(messaging_consumer_messages_total[5m])) > 0
    for: 5m
    labels:
      severity: "critical"
    annotations:
      summary: "go-streams {{ $labels.job }} error ratio above 5%"
      description: "{{ $value | humanizePercentage }} of consumed records errored over the last 5m (threshold 5%). A significant share of traffic is failing — check stream_error_phase for whether serde, processing or production is responsible."

  # Poison pills: records failing (de)serialization.
  - alert: GoStreamsSerdeErrors
    expr: |
      sum by (job) (rate(stream_errors_total{stream_error_phase="serde"}[5m])) > 0
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} hitting serde errors (poison pills)"
      description: "{{ $value | humanize }} records/sec failing (de)serialization for 10 minutes — usually schema drift or corrupt input. Route these to a DLQ via WithSerdeErrorHandler instead of retrying."

  # Sink-side failures — the produce path to Kafka is unhealthy.
  - alert: GoStreamsProductionErrors
    expr: |
      sum by (job) (rate(stream_errors_total{stream_error_phase="production"}[5m])) > 0
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} failing to produce to Kafka"
      description: "{{ $value | humanize }} sink/producer errors/sec for 10 minutes. Check broker health, topic existence/ACLs and message-size limits."

  # An error handler returned Fail: the runner is shutting down. Metric export
  # stops with it, so this alert goes stale rather than resolving — pair it with
  # deployment-level up/absent alerting for sustained outage detection.
  - alert: GoStreamsFailActionTriggered
    expr: |
      sum by (job) (increase(stream_errors_total{stream_error_action="fail"}[10m])) > 0
    labels:
      severity: "critical"
    annotations:
      summary: "go-streams {{ $labels.job }} hit a fatal error and is stopping"
      description: "An error handler in {{ $labels.job }} returned the Fail action within the last 10 minutes; the runner stops processing. Find the failing node via the stream_error_node label and the application logs."

  # Pipeline healthy but diverting records to the dead-letter queue.
  - alert: GoStreamsDLQTraffic
    expr: |
      sum by (job) (rate(stream_errors_total{stream_error_action="send_to_dlq"}[5m])) > 0
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} routing records to the DLQ"
      description: "{{ $value | humanize }} records/sec sent to the DLQ for 10 minutes. Processing continues, but diverted data needs attention — inspect the DLQ topic and upstream data quality."

  # Sustained retries burn capacity and inflate the per-attempt topology metrics
  # (node/edge throughput exceeds the consumed rate by the retry factor).
  - alert: GoStreamsHighRetryRate
    expr: |
      sum by (job) (rate(stream_process_retries_total[5m])) > 5
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} retry rate above 5/sec"
      description: "{{ $value | humanize }} retries/sec for 10 minutes. Check stream_error_phase to see which stage is retrying; consider tighter retry limits or DLQ routing for persistent failures."

# Latency — is work slow?
- name: go-streams.latency
  rules:

  # p99 end-to-end record processing time. Threshold sits one bucket below the
  # histogram ceiling (5s) — quantile estimates saturate at the top finite bucket.
  - alert: GoStreamsHighProcessingLatency
    expr: |
      histogram_quantile(0.99, sum by (job, le) (rate(stream_process_duration_seconds_bucket[5m]))) > 2.5
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} p99 processing latency above 2.5s"
      description: "p99 record processing takes {{ $value | humanize }}s. Use the Topology Explorer dashboard to find the slow node (stream_node_latency is exclusive self-time)."

  # p99 Send() time; the histogram ceiling is 2.5s.
  - alert: GoStreamsHighProduceLatency
    expr: |
      histogram_quantile(0.99, sum by (job, le) (rate(stream_produce_duration_seconds_bucket[5m]))) > 1.0
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} p99 produce latency above 1.0s"
      description: "p99 produce to Kafka takes {{ $value | humanize }}s. Check broker health, acks/linger settings and network latency."

# Saturation — is the runner keeping up?
- name: go-streams.saturation
  rules:

  # Record age at consumption (event-time lag); the metric has no _seconds
  # suffix. Only observed on consumed records — GoStreamsConsumptionStalled
  # covers the total-stall case.
  - alert: GoStreamsConsumerLagHigh
    expr: |
      histogram_quantile(0.99, sum by (job, le) (rate(stream_consumer_lag_bucket[5m]))) > 30
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} p99 consumer lag above 30s"
      description: "Records are {{ $value | humanize }}s old at p99 when consumed — processing is falling behind production. Check the Runner & Saturation dashboard and consider scaling out."

  # Lag buckets top out at 300s, so the estimate saturates there.
  - alert: GoStreamsConsumerLagCritical
    expr: |
      histogram_quantile(0.99, sum by (job, le) (rate(stream_consumer_lag_bucket[5m]))) > 120
    for: 10m
    labels:
      severity: "critical"
    annotations:
      summary: "go-streams {{ $labels.job }} p99 consumer lag above 120s"
      description: "Records are {{ $value | humanize }}s old at p99 when consumed and the backlog is growing. Scale out or fix the bottleneck now — lag buckets top out at 300s, so the true lag may be far higher."

  # PartitionedRunner only: records buffered in worker channels plus pending overflow.
  - alert: GoStreamsQueueDepthHigh
    expr: |
      sum by (job) (stream_partitioned_queue_depth) > 1000
    for: 5m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} worker queues holding over 1000 records"
      description: "{{ $value | humanize }} records buffered across partition workers for 5 minutes. Workers are slower than the poll loop — check processing latency and WithChannelBufferSize, and consider more partitions or instances."

  # PartitionedRunner only. Backpressure pauses should be transient; 15 minutes
  # paused means a worker is stuck or badly underprovisioned.
  - alert: GoStreamsPausedPartitionsStuck
    expr: |
      sum by (job) (stream_partitioned_paused_depth) > 0
    for: 15m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} partitions paused by backpressure for 15m+"
      description: "{{ $value | humanize }} records are sitting in paused partitions and not draining. Look for a stuck or very slow processor on the paused partitions."

  # PartitionedRunner only. Frequent pauses mean workers can't keep up with the poll rate.
  - alert: GoStreamsBackpressureThrash
    expr: |
      sum by (job) (rate(stream_partitioned_backpressure_events_total{stream_backpressure_event="paused"}[5m])) > 1
    for: 10m
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} partitions being paused over 1/sec"
      description: "{{ $value | humanize }} backpressure pauses/sec for 10 minutes. If the resume rate is similar this is pause/resume thrash — lower WithResumeThreshold for more hysteresis; otherwise increase WithChannelBufferSize or speed up processors."

  # Frequent rebalances drain workers and pause processing; the 10m increase
  # window is the flap dampener.
  - alert: GoStreamsRebalanceStorm
    expr: |
      sum by (job) (increase(stream_rebalance_count_total[10m])) > 5
    labels:
      severity: "warning"
    annotations:
      summary: "go-streams {{ $labels.job }} rebalancing frequently"
      description: "{{ $value | humanize }} rebalance events in 10 minutes (threshold 5). Look for crash-looping instances, deployment churn, or slow poll loops exceeding the session timeout."
