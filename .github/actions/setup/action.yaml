name: "Setup and Cache"

inputs:
  mise-version:
    description: "The version of Mise to setup"
    required: false
    default: "2025.12.12"
  make-deps:
    description: "Whether to run 'make deps' to install dependencies"
    required: false
    default: "true"
  docker:
    description: "Whether to setup Docker"
    required: false
    default: "false"

runs:
  using: "composite"

  steps:
    - name: Mise Install
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: ${{ inputs.mise-version }}

    - name: Setup Docker
      if: ${{ inputs.docker == 'true' }}
      uses: docker/setup-docker-action@6d7cfa65f60a9dda7b46e5513fa982536f3c9877 # v5.3.0

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.make-deps == 'true' }}
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      shell: bash
      if: ${{ inputs.make-deps == 'true' }}
      run: mise deps
